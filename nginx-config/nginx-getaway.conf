events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance optimizations for local development
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;



        # +++++ Backend routes (FastAPI) +++++
        # Any request starting with /api goes directly to the earnIt_api container
        location /api/ {
            client_max_body_size 6m;
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route for FastAPI's interactive docs
        location /docs {
            proxy_pass http://api:8000/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api:8000/openapi.json;
            proxy_set_header Host $host;
        }

        # +++++ Frontend route (Vite dev server) +++++
        # Any other route is served by the React app
        location / {
            proxy_pass http://frontend:5173/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # CRUCIAL CONFIG: allow Vite WebSockets (HMR) to work through Nginx.
            # Without this, saving code won't trigger auto-refresh.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
