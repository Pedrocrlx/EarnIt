events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Otimizações de performance ideais para apresentação
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;



        # +++++ Rotas do Backend (FastAPI) +++++
        # Toda requisição iniciada por /api vai direto para o container earnIt_api [cite: 32]
        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rota para a documentação interativa automática do FastAPI
        location /docs {
            proxy_pass http://api:8000/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api:8000/openapi.json;
            proxy_set_header Host $host;
        }

        # +++++ Rota do Frontend (Vite Dev Server) +++++
        # Qualquer outra rota bate aqui e puxa o app em React
        location / {
            proxy_pass http://frontend:5173/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # CONFIGURAÇÃO CRUCIAL: Permite que o WebSockets (HMR / Hot Module Replacement)
            # do Vite funcione através do Nginx. Sem isso, salvar o código não atualiza a página sozinho.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
