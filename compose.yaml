services:
  # +++++ NGINX Reverse Proxy (The Front Door) +++++++++++++++++++++++++++++++++++++++++
  proxy:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    ports:
      # ONLY NGINX exposes ports to the outside world
      # - "443:443" # Uncomment if you add SSL certificates
      - "80:80" # Use this for Development
    volumes:
      - ./nginx-config/nginx-getaway.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  # +++++ PostgreSQL Database +++++++++++++++++++++++++++++++++++++++++
  db:
    image: postgres:17-alpine
    container_name: earnIt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      #- ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # +++++ Mail Server (Mailpit) +++++++++++++++++++++++++++++++++++++++++
  mailpit:
    image: axllent/mailpit:v1.30.1
    container_name: earnIt_mail
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    
  # +++++ FastAPI +++++++++++++++++++++++++++++++++++++++++
  api:
    container_name: earnIt_api
    build:
      context: ./backend
      dockerfile: ops/Dockerfile
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_HOST: db
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # +++++ React (Bun + Vite) +++++++++++++++++++++++++++++++++++++++++
  frontend:
    build:
      context: ./frontend
      dockerfile: ops/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
