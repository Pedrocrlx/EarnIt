# HTTPS terminates at the VPS's main Nginx. Preserve its protocol header.
map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 6m;

    # Docker DNS re-resolves the API after container replacement.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream api:8000;

    location ~ ^/(api(?:/|$)|health$|docs(?:/|$)|openapi\.json$|redoc$) {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
