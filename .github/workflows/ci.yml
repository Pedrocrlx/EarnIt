name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6.0.1
        with:
          version: "0.12.15"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run --frozen ruff check .

  frontend-lint:
    name: Frontend ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend lint
        run: bun run lint

  backend-test:
    name: Backend Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: earnit_user
          POSTGRES_PASSWORD: earnit
          POSTGRES_DB: earnit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U earnit_user -d earnit_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: earnit_user
      POSTGRES_PASSWORD: earnit
      POSTGRES_DB: earnit_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      SECRET_KEY: ci-test-secret-key
      MAIL_SERVER: localhost
      MAIL_PORT: 1025
      DISABLE_AUTH: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6.0.1
        with:
          version: "0.12.15"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        env:
          AVATAR_UPLOAD_DIR: ${{ runner.temp }}/avatars
          SUBMISSION_PROOF_UPLOAD_DIR: ${{ runner.temp }}/submission-proofs
        run: uv run --frozen pytest -q
