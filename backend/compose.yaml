services:
  # PostgreSQL 17 — schema managed by Alembic, data persisted in a named volume.
  db:
    image: postgres:17-alpine
    container_name: earnIt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI app — mounts the source tree so code changes are picked up without rebuilds.
  api:
    container_name: earnIt_api
    build:
      context: .
      dockerfile: ops/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # Mailpit — captures all outbound SMTP (port 1025) and exposes a web UI at port 8025.
  mailpit:
    image: axllent/mailpit:v1.30.1
    container_name: earnIt_mailpit
    ports:
      - "8025:8025"   # web UI: open http://localhost:8025 to read captured emails
      - "1025:1025"   # SMTP sink: fastapi-mail sends here
    restart: unless-stopped

volumes:
  postgres_data:
