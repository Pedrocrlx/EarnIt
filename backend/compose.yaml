services:
    # +++++ PostgreSQL Database +++++++++++++++++++++++++++++++++++++++++
    db:
        image: postgres:17-alpine
        container_name: earnIt_db
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
        env_file:
            - .env
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5

    # +++++ FastAPI +++++++++++++++++++++++++++++++++++++++++
    api:
        container_name: earnIt_api
        build:
            context: .
            dockerfile: ops/Dockerfile
        ports:
            - "8000:8000"
        volumes:
            - .:/app
        depends_on:
            db:
                condition: service_healthy

volumes:
    postgres_data:
