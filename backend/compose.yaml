# Mailpit lives in its own compose file (mail/compose.yaml), isolated from
# the backend services below — see mail/README.md.
include:
  - mail/compose.yaml

services:
  # PostgreSQL 17 — schema managed by Alembic, data persisted in a named volume.
  db:
    image: postgres:17-alpine
    container_name: earnIt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI app — mounts the source tree so code changes are picked up without rebuilds.
  api:
    container_name: earnIt_api
    build:
      context: .
      dockerfile: ops/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      # .env (mounted into the container) targets local/pytest with
      # POSTGRES_HOST=localhost — override it to the compose service name so
      # the api container reaches the db container.
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
