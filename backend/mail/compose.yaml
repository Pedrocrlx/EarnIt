services:
  # Mailpit — captures all outbound SMTP and exposes a web UI to read it.
  # Isolated in its own compose file so it can be started/stopped/debugged
  # independently of the EarnIt application services (db/api/frontend/proxy),
  # and so its definition lives in exactly one place — both the root and
  # backend compose files `include` this file rather than redefining it.
  mailpit:
    image: axllent/mailpit:v1.30.1
    container_name: earnIt_mailpit
    ports:
      - "8025:8025"   # web UI: open http://localhost:8025 to read captured emails
      - "1025:1025"   # SMTP sink: the API sends here (MAIL_SERVER=mailpit, MAIL_PORT=1025)
    restart: unless-stopped
