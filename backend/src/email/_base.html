<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}EarnIt{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1f5e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #191c1e;
    }
    .wrapper {
      max-width: 480px;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(3, 78, 34, 0.08);
    }
    .header {
      background-color: #003514;
      padding: 32px 40px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .body {
      padding: 40px;
    }
    .body p {
      margin: 0 0 16px;
      font-size: 15px;
      line-height: 1.6;
      color: #404940;
    }
    .code-block {
      margin: 28px 0;
      text-align: center;
    }
    .code {
      display: inline-block;
      background-color: #eef7d1;
      border: 1px solid #d4e251;
      border-radius: 8px;
      padding: 16px 32px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #003514;
      font-family: "Courier New", Courier, monospace;
    }
    .expiry {
      font-size: 13px;
      color: #59625a;
      text-align: center;
      margin-top: 8px;
    }
    .footer {
      padding: 24px 40px;
      border-top: 1px solid #e1e2e4;
      font-size: 12px;
      color: #7a8278;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>EarnIt</h1>
    </div>
    <div class="body">
      <p>Olá,</p>
      <p>{% block intro %}{% endblock %}</p>
      <div class="code-block">
        <span class="code">{{ code }}</span>
        <p class="expiry">Este código expira em {{ expiry_minutes }} minutos.</p>
      </div>
      <p>{% block ignore_note %}{% endblock %}</p>
    </div>
    <div class="footer">
      EarnIt &mdash; Gestor de Mesada Familiar<br />
      Esta é uma mensagem automática. Por favor, não responda.
    </div>
  </div>
</body>
</html>
