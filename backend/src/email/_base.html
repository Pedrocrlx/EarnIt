<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}EarnIt{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #18181b;
    }
    .wrapper {
      max-width: 480px;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .header {
      background-color: #6366f1;
      padding: 32px 40px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .body {
      padding: 40px;
    }
    .body p {
      margin: 0 0 16px;
      font-size: 15px;
      line-height: 1.6;
      color: #3f3f46;
    }
    .code-block {
      margin: 28px 0;
      text-align: center;
    }
    .code {
      display: inline-block;
      background-color: #f4f4f5;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 16px 32px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #18181b;
      font-family: "Courier New", Courier, monospace;
    }
    .expiry {
      font-size: 13px;
      color: #71717a;
      text-align: center;
      margin-top: 8px;
    }
    .footer {
      padding: 24px 40px;
      border-top: 1px solid #f4f4f5;
      font-size: 12px;
      color: #a1a1aa;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>EarnIt</h1>
    </div>
    <div class="body">
      <p>Hi there,</p>
      <p>{% block intro %}{% endblock %}</p>
      <div class="code-block">
        <span class="code">{{ code }}</span>
        <p class="expiry">This code expires in {{ expiry_minutes }} minutes.</p>
      </div>
      <p>{% block ignore_note %}{% endblock %}</p>
    </div>
    <div class="footer">
      EarnIt &mdash; Family Allowance Manager<br />
      This is an automated message. Please do not reply.
    </div>
  </div>
</body>
</html>
