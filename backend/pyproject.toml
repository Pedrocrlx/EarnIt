[project]
name = "Backend-Directory-of-EarnIt-MVP"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi-mail>=1.6.4",
    "fastapi[standard]>=0.136.3",
    "greenlet>=3.5.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0.1",
    "sqlmodel>=0.0.38",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]
ignore = [
    "B008",   # Depends(...) in argument defaults is the standard FastAPI DI pattern
    "RUF001", # en/em dashes are used intentionally in user-facing strings
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]
